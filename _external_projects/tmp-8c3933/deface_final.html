<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 Nadia VPN Store - Defaced by Xerion 💀</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }
        #matrix {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .skull {
            font-size: 120px;
            animation: glitch 0.3s infinite;
            filter: drop-shadow(0 0 20px #f00);
        }
        h1 {
            font-size: 50px;
            color: #f00;
            text-shadow: 0 0 20px #f00, 0 0 40px #f00;
            margin: 20px 0;
            animation: glitch 0.5s infinite;
        }
        h2 {
            font-size: 30px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            margin: 10px 0;
        }
        .subtitle {
            font-size: 20px;
            color: #ff0;
            margin: 10px 0;
        }
        .credit {
            font-size: 18px;
            color: #0ff;
            margin: 30px 0 10px;
        }
        .date {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }
        .blink {
            animation: blink 1s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            60% { transform: translate(-5px, -5px); }
            80% { transform: translate(5px, 5px); }
            100% { transform: translate(0); }
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .line {
            width: 500px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0f0, transparent);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="content">
        <div class="skull">💀</div>
        <h1>NADIA VPN STORE</h1>
        <div class="line"></div>
        <h2>Successfully Defaced!</h2>
        <div class="subtitle">SQL Injection Vulnerability</div>
        <div class="line"></div>
        <div class="credit">Hacked By Xerion</div>
        <div class="date">October 24, 2026</div>
        <div class="subtitle blink">Cloudflare Turnstile Bypassed</div>
    </div>
    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%! NadiaVPNStore';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
