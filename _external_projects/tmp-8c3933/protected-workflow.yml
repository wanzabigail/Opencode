name: OpenCode Cloud Pro v2 (Terbaru + Custom Provider + Anti-Block UI + 24/7)

on:
  workflow_dispatch:
    inputs:
      versi_opencode:
        description: "Pilih versi OpenCode (v2 = Terbaru v2.1+ Full Fix, v1 = Klasik v1.19+)"
        type: choice
        options:
          - v2
          - v1
        required: true
        default: "v2"
      password_login:
        description: "Password login (kosongkan jika sudah pakai Secret OPENCODE_PASSWORD)"
        required: false
        default: ""
      durasi_menit:
        description: "Durasi per sesi dalam menit (maks 350 = hampir 6 jam)"
        required: true
        default: "350"
      lanjut_otomatis:
        description: "Lanjut otomatis 24 jam nonstop? (Centang agar nyambung terus tiap 6 jam)"
        type: boolean
        required: true
        default: true

jobs:
  opencode-web:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
      pages: write
      id-token: write

    steps:
      - name: 1. Ambil Kode & Backup Sebelumnya (Full Git History agar Project ID Permanen)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 2. Install OpenCode (${{ inputs.versi_opencode }}), Custom Provider Patch, Panel & Helper
        env:
          OC_VER: ${{ inputs.versi_opencode }}
        run: |
          # Simpan salinan workflow agar tidak pernah terhapus tak sengaja oleh agen AI
          cp .github/workflows/opencode-web.yml /tmp/protected-workflow.yml 2>/dev/null || true

          sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null 2>&1 || true

          mkdir -p "$HOME/.local/bin"
          if [ "$OC_VER" = "v1" ]; then
            curl -fsSL https://opencode.ai/install | bash
          else
            # Default: Install OpenCode Generasi Terbaru v2 (v2.1.x+)
            curl -fsSL https://opencode.ai/v2/install | bash
          fi
          cp "$HOME/.opencode/bin/opencode" "$HOME/.local/bin/opencode"
          echo "Versi OpenCode terinstal: $($HOME/.local/bin/opencode --version)"

          # Install Bun (super cepat untuk JS/TS build modern)
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          [ -d "$HOME/.bun/bin" ] && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

          # Install Cloudflare Tunnel
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$HOME/.local/bin/cloudflared"
          chmod +x "$HOME/.local/bin/opencode" "$HOME/.local/bin/cloudflared"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Konfigurasi default model gratis OpenCode (kompatibel penuh di v2 maupun v1)
          if [ ! -f opencode.json ]; then
            printf '{\n  "$schema": "https://opencode.ai/config.json",\n  "model": "opencode/deepseek-v4.1-flash-free"\n}\n' > opencode.json
          fi

          # Pastikan .gitignore aman agar node_modules / build raksasa & file rahasia .env tidak bocor ke publik
          if [ ! -f .gitignore ]; then
            cat << 'GITEOF' > .gitignore
          node_modules/
          .next/
          .nuxt/
          .svelte-kit/
          .gradle/
          **/build/intermediates/
          **/build/tmp/
          __pycache__/
          .venv/
          venv/
          target/debug/
          .opencode-backup.enc
          .opencode-backup.enc.tmp
          .env
          .env.*
          !.env.example
          !.env.sample
          !.env.template
          GITEOF
          else
            for rule in ".opencode-backup.enc" ".env" ".env.*" "!.env.example" "!.env.sample"; do
              grep -qxF "$rule" .gitignore 2>/dev/null || echo "$rule" >> .gitignore
            done
          fi

          # Panduan pintar otomatis untuk Agen AI OpenCode (AGENTS.md)
          if [ ! -f AGENTS.md ]; then
            cat << 'AGENTEOF' > AGENTS.md
          # OpenCode Cloud Pro Environment Guide

          Kamu berjalan di mesin Linux Cloud berkapasitas besar (16 GB RAM, 4 vCPU, Ubuntu 24.04) dengan akses internet penuh:
          - **Web & Fullstack:** Node.js, npm, pnpm, yarn, Bun, Python 3, PHP, Go, Rust, Docker & Docker Compose tersedia.
          - **Live Preview Web:** Saat menjalankan dev server (Next.js, Vite, Flask, PHP, dll.), SELALU bind ke `0.0.0.0` (contoh: `npm run dev -- --host 0.0.0.0 --port 3000`). User dapat langsung membukanya lewat tombol **⚡ Panel** di bagian atas tengah layar!
          - **Build Aplikasi Android (.apk):** Java JDK 17/21, Gradle, dan Android SDK lengkap SUDAH TERINSTAL di `$ANDROID_HOME` (`/usr/local/lib/android/sdk`). Jika diminta membuat aplikasi Android, buat project Gradle lengkap dan jalankan `./gradlew assembleDebug` — file `.apk` otomatis muncul sebagai tombol Download 1-Klik di **⚡ Panel** user!
          - **Penyimpanan Permanen:** Selalu simpan seluruh project di dalam folder repository saat ini (`$PWD`) agar otomatis ter-backup ke GitHub setiap 10 menit.
          AGENTEOF
          fi

          # ------------------------------------------------------------------
          # Helper 1A: Simpan Atomic SQLite WAL + Subproject + External Project + AES-256
          # ------------------------------------------------------------------
          cat << 'SAVEEOF' > "$HOME/.local/bin/oc-save"
          #!/usr/bin/env bash
          exec 9>/tmp/oc-save.lock
          flock -w 90 9 || exit 0

          cd "$WORKSPACE_DIR" || exit 1
          git config user.name "OpenCode Cloud" 2>/dev/null || true
          git config user.email "bot@opencode.local" 2>/dev/null || true

          if [ -f /tmp/protected-workflow.yml ]; then
            mkdir -p .github/workflows
            cp /tmp/protected-workflow.yml .github/workflows/opencode-web.yml
          fi

          STAGE_DIR=$(mktemp -d)
          trap 'rm -rf "$STAGE_DIR"' EXIT

          python3 - "$HOME" "$WORKSPACE_DIR" "$STAGE_DIR" << 'PYEOF'
          import os, sys, json, shutil, sqlite3, subprocess, hashlib

          home_dir, ws_dir, stage_dir = [os.path.realpath(x) for x in sys.argv[1:4]]
          skip_heavy = {
              ".git", "node_modules", ".next", ".nuxt", ".svelte-kit",
              ".gradle", "target", ".venv", "venv", "__pycache__", ".cache"
          }

          # 1. Stage OpenCode dirs menggunakan SQLite C Online Backup API (.backup()) agar 100% aman dari korupsi WAL saat live chat!
          home_out = os.path.join(stage_dir, "home")
          os.makedirs(home_out, exist_ok=True)
          for rel_dir, skip_sub in [
              (".local/share/opencode", {"log"}),
              (".config/opencode", set()),
              (".local/state/opencode", {"locks", "service.json"}),
          ]:
              src_root = os.path.join(home_dir, rel_dir)
              if not os.path.isdir(src_root):
                  continue
              for cur, dirs, files in os.walk(src_root):
                  dirs[:] = [d for d in dirs if d not in skip_sub]
                  rel_cur = os.path.relpath(cur, home_dir)
                  dst_cur = os.path.join(home_out, rel_cur)
                  os.makedirs(dst_cur, exist_ok=True)
                  for f in files:
                      if rel_cur == ".local/state/opencode" and f == "service.json":
                          continue
                      if f.endswith("-wal") or f.endswith("-shm"):
                          continue
                      s_file = os.path.join(cur, f)
                      d_file = os.path.join(dst_cur, f)
                      try:
                          if f.endswith(".db"):
                              s_conn = sqlite3.connect(s_file, timeout=15)
                              d_conn = sqlite3.connect(d_file)
                              with d_conn:
                                  s_conn.backup(d_conn)
                              d_conn.close()
                              s_conn.close()
                          elif os.path.isfile(s_file):
                              shutil.copy2(s_file, d_file)
                      except Exception:
                          if os.path.isfile(s_file):
                              try:
                                  shutil.copy2(s_file, d_file)
                              except Exception:
                                  pass

          # 2. Simpan pin .git/opencode & sinkronkan project eksternal di luar $WORKSPACE_DIR (misal dibuat dari tombol "+ Open project")!
          db_copy = os.path.join(home_out, ".local/share/opencode/opencode.db")
          ext_root = os.path.join(ws_dir, "_external_projects")
          ext_manifest = []
          pins = {}
          git_oc_path = os.path.join(ws_dir, ".git", "opencode")
          if os.path.isfile(git_oc_path):
              try:
                  pins["__workspace__"] = open(git_oc_path, "r", encoding="utf-8").read().strip()
              except Exception:
                  pass

          if os.path.isfile(db_copy):
              try:
                  conn = sqlite3.connect(db_copy)
                  for pid, wt in conn.execute("SELECT id, worktree FROM project").fetchall():
                      if not wt:
                          continue
                      wt_real = os.path.realpath(wt)
                      pins[wt] = pid
                      if wt_real == home_dir or wt_real == ws_dir or wt_real.startswith(ws_dir + os.sep):
                          continue
                      if wt_real in ("/", "/usr", "/etc", "/bin", "/lib", "/proc", "/sys", "/dev") or any(
                          wt_real.startswith(p) for p in ("/usr/", "/etc/", "/proc/", "/sys/", "/dev/")
                      ):
                          continue
                      if os.path.isdir(wt) and not os.path.islink(wt):
                          slug = os.path.basename(wt.rstrip("/")) + "-" + hashlib.sha1(wt.encode()).hexdigest()[:6]
                          dst_ext = os.path.join(ext_root, slug)
                          os.makedirs(dst_ext, exist_ok=True)
                          for cur, dirs, files in os.walk(wt):
                              dirs[:] = [d for d in dirs if d not in skip_heavy]
                              rel_p = os.path.relpath(cur, wt)
                              d_dir = os.path.join(dst_ext, rel_p)
                              os.makedirs(d_dir, exist_ok=True)
                              for fn in files:
                                  sf = os.path.join(cur, fn)
                                  df = os.path.join(d_dir, fn)
                                  try:
                                      if os.path.isfile(sf) and os.path.getsize(sf) < 95_000_000:
                                          shutil.copy2(sf, df)
                                  except Exception:
                                      pass
                          ext_manifest.append({"slug": slug, "worktree": wt, "project_id": pid})
                      elif os.path.islink(wt):
                          target_rel = os.path.relpath(os.path.realpath(wt), ext_root)
                          if not target_rel.startswith(".."):
                              ext_manifest.append({"slug": target_rel.split(os.sep)[0], "worktree": wt, "project_id": pid})
                  conn.close()
              except Exception:
                  pass

          if ext_manifest:
              os.makedirs(ext_root, exist_ok=True)
              with open(os.path.join(ext_root, "manifest.json"), "w", encoding="utf-8") as mf:
                  json.dump(ext_manifest, mf, indent=2)

          with open(os.path.join(stage_dir, "pins.json"), "w", encoding="utf-8") as pf:
              json.dump(pins, pf, indent=2)

          # 3. Aman dari error fatal Git akibat nested `.git` di subfolder (cth: `create-next-app`, `cargo new`, `flutter create`, `git init`)!
          for cur, dirs, files in os.walk(ws_dir):
              rel_cur = os.path.relpath(cur, ws_dir)
              if rel_cur == ".":
                  dirs[:] = [d for d in dirs if d not in {".git", "node_modules", ".gradle", ".venv", "venv"}]
                  continue
              if ".git" in dirs:
                  nested_git = os.path.join(cur, ".git")
                  backup_git = os.path.join(cur, ".git_subrepo_saved")
                  try:
                      if os.path.exists(backup_git):
                          shutil.rmtree(backup_git) if os.path.isdir(backup_git) else os.remove(backup_git)
                      shutil.move(nested_git, backup_git)
                      subprocess.run(["git", "-C", ws_dir, "rm", "--cached", "-rf", "--ignore-unmatch", rel_cur],
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  except Exception:
                      pass
                  dirs.remove(".git")
              dirs[:] = [d for d in dirs if d not in {".git_subrepo_saved", "node_modules", ".gradle", ".venv", "venv"}]

          # 4. Amankan semua file rahasia `.env` / `.env.*` ke dalam arsip terenkripsi AES-256 (aman walau repo Public)!
          env_dir = os.path.join(stage_dir, "envs")
          os.makedirs(env_dir, exist_ok=True)
          env_manifest = []
          safe_env_examples = {".env.example", ".env.sample", ".env.template"}
          for cur, dirs, files in os.walk(ws_dir):
              dirs[:] = [d for d in dirs if d not in skip_heavy and d != ".git_subrepo_saved"]
              for fn in files:
                  if (fn == ".env" or fn.startswith(".env.")) and fn not in safe_env_examples:
                      full_env = os.path.join(cur, fn)
                      rel_env = os.path.relpath(full_env, ws_dir)
                      key_name = hashlib.sha1(rel_env.encode()).hexdigest()
                      try:
                          shutil.copy2(full_env, os.path.join(env_dir, key_name))
                          env_manifest.append({"rel": rel_env, "key": key_name})
                      except Exception:
                          pass
          with open(os.path.join(stage_dir, "envs.json"), "w", encoding="utf-8") as ef:
              json.dump(env_manifest, ef, indent=2)
          PYEOF

          # 5. Enkripsi AES-256-CBC PBKDF2 & simpan ke orphan branch `oc-backup` (0% pembengkakan ukuran Git walau jalan bertahun-tahun!)
          PUSH_REMOTE=""
          if [ -n "$GITHUB_REPOSITORY" ] && [ -n "$GH_TOKEN" ]; then
            PUSH_REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            PUSH_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
          fi

          if [ -n "$FINAL_PW" ]; then
            TMP_BKP=$(mktemp -d)
            if tar -czf - -C "$STAGE_DIR" . 2>/dev/null \
              | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:FINAL_PW -out "$TMP_BKP/opencode-backup.enc"; then
              if [ -n "$PUSH_REMOTE" ]; then
                (
                  cd "$TMP_BKP"
                  git init -q -b oc-backup
                  git config user.name "OpenCode Cloud"
                  git config user.email "bot@opencode.local"
                  git add opencode-backup.enc
                  git commit -q -m "chore: encrypted OpenCode state snapshot"
                  if git push -f -q "$PUSH_REMOTE" oc-backup >/dev/null 2>&1; then
                    rm -f "$WORKSPACE_DIR/.opencode-backup.enc"
                  else
                    cp "$TMP_BKP/opencode-backup.enc" "$WORKSPACE_DIR/.opencode-backup.enc"
                  fi
                )
              else
                cp "$TMP_BKP/opencode-backup.enc" "$WORKSPACE_DIR/.opencode-backup.enc"
              fi
            fi
            rm -rf "$TMP_BKP"
          fi

          # 6. Simpan seluruh kode project ke branch utama (tanpa file rahasia .env & tanpa file >95MB)
          git add -A 2>/dev/null || true
          git diff --cached --name-only | while IFS= read -r file; do
            base=$(basename "$file")
            if [ "$base" = ".env" ] || { [[ "$base" == .env.* ]] && [ "$base" != ".env.example" ] && [ "$base" != ".env.sample" ] && [ "$base" != ".env.template" ]; }; then
              git rm --cached -f --ignore-unmatch "$file" >/dev/null 2>&1 || true
              continue
            fi
            if [ -f "$file" ]; then
              size=$(wc -c < "$file" 2>/dev/null || echo 0)
              if [ "$size" -gt 99000000 ]; then
                echo "Melewati file >95MB dari git push (tetap bisa diunduh lewat Cloud Panel): $file"
                git reset HEAD "$file" >/dev/null 2>&1 || true
              fi
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "${1:-chore: auto-save kode project OpenCode}" || true
            git pull --rebase --autostash >/dev/null 2>&1 || true
            if [ -n "$PUSH_REMOTE" ]; then
              CUR_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "HEAD")
              git push "$PUSH_REMOTE" "HEAD:${CUR_BRANCH}" >/dev/null 2>&1 || git push >/dev/null 2>&1 || true
            else
              git push >/dev/null 2>&1 || true
            fi
          fi
          SAVEEOF
          chmod +x "$HOME/.local/bin/oc-save"

          # ------------------------------------------------------------------
          # Helper 1B: Pulihkan Session, Chat, Project Eksternal, .env & Pin Project ID
          # ------------------------------------------------------------------
          cat << 'RESTOREEOF' > "$HOME/.local/bin/oc-restore"
          #!/usr/bin/env bash
          cd "$WORKSPACE_DIR" || exit 1
          ENC_FILE=""
          TMP_RES=$(mktemp -d)
          trap 'rm -rf "$TMP_RES"' EXIT

          FETCH_REMOTE=""
          if [ -n "$GITHUB_REPOSITORY" ] && [ -n "$GH_TOKEN" ]; then
            FETCH_REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            FETCH_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
          fi

          if [ -n "$FETCH_REMOTE" ] && git fetch -q "$FETCH_REMOTE" oc-backup 2>/dev/null; then
            if git show FETCH_HEAD:opencode-backup.enc > "$TMP_RES/backup.enc" 2>/dev/null && [ -s "$TMP_RES/backup.enc" ]; then
              ENC_FILE="$TMP_RES/backup.enc"
            fi
          fi
          if [ -z "$ENC_FILE" ] && [ -f "$WORKSPACE_DIR/.opencode-backup.enc" ]; then
            ENC_FILE="$WORKSPACE_DIR/.opencode-backup.enc"
          fi

          if [ -n "$ENC_FILE" ] && [ -n "$FINAL_PW" ]; then
            echo "Memulihkan riwayat chat, session, custom provider & .env dari enkripsi AES-256 ..."
            mkdir -p "$TMP_RES/unpack"
            if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FINAL_PW -in "$ENC_FILE" 2>/dev/null | tar -xzf - -C "$TMP_RES/unpack" 2>/dev/null; then
              if [ -d "$TMP_RES/unpack/home" ]; then
                cp -a "$TMP_RES/unpack/home/." "$HOME/"
              else
                # Kompatibilitas mundur penuh untuk format arsip lama (.local / .config langsung di root tar)
                cp -a "$TMP_RES/unpack/." "$HOME/"
              fi
              echo "✅ Database riwayat chat, session & custom provider berhasil dipulihkan!"
            else
              echo "⚠️ Backup lama memakai password berbeda — memulai database session baru."
            fi
          fi

          # Pulihkan .env, symlink project eksternal, dan kunci Project ID permanen agar 0% chat yatim/hilang!
          python3 - "$HOME" "$WORKSPACE_DIR" "$TMP_RES/unpack" << 'PYRESEOF'
          import os, sys, json, shutil, sqlite3, subprocess

          home_dir = os.path.realpath(sys.argv[1])
          ws_dir = os.path.realpath(sys.argv[2])
          unpack_dir = sys.argv[3]

          # 1. Pulihkan semua file rahasia `.env` ke lokasi aslinya masing-masing
          envs_json = os.path.join(unpack_dir, "envs.json")
          if os.path.isfile(envs_json):
              try:
                  for item in json.load(open(envs_json, "r", encoding="utf-8")):
                      src = os.path.join(unpack_dir, "envs", item["key"])
                      dst = os.path.realpath(os.path.join(ws_dir, item["rel"]))
                      if dst.startswith(ws_dir + os.sep) and os.path.isfile(src):
                          os.makedirs(os.path.dirname(dst), exist_ok=True)
                          shutil.copy2(src, dst)
              except Exception:
                  pass

          # 2. Pulihkan symlink semua project eksternal di luar $WORKSPACE_DIR (cth: /home/runner/proyek-ku)
          ext_manifest_file = os.path.join(ws_dir, "_external_projects", "manifest.json")
          if os.path.isfile(ext_manifest_file):
              try:
                  for item in json.load(open(ext_manifest_file, "r", encoding="utf-8")):
                      src_proj = os.path.join(ws_dir, "_external_projects", item["slug"])
                      wt_path = item["worktree"]
                      if os.path.isdir(src_proj) and not os.path.exists(wt_path):
                          os.makedirs(os.path.dirname(wt_path), exist_ok=True)
                          os.symlink(src_proj, wt_path)
              except Exception:
                  pass

          # 3. Kunci Project ID permanen (.git/opencode) + satukan semua sesi lama di SQLite agar tidak pernah terpisah!
          pins = {}
          pins_file = os.path.join(unpack_dir, "pins.json")
          if os.path.isfile(pins_file):
              try:
                  pins = json.load(open(pins_file, "r", encoding="utf-8"))
              except Exception:
                  pass

          root_sha = ""
          try:
              out = subprocess.check_output(["git", "-C", ws_dir, "rev-list", "--max-parents=0", "HEAD"], text=True).strip().splitlines()
              if out:
                  root_sha = out[-1].strip()
          except Exception:
              pass

          canonical_id = pins.get("__workspace__") or pins.get(ws_dir) or root_sha
          db_file = os.path.join(home_dir, ".local/share/opencode/opencode.db")
          if os.path.isfile(db_file):
              try:
                  conn = sqlite3.connect(db_file)
                  rows = conn.execute("SELECT id, worktree FROM project").fetchall()
                  ws_ids = [pid for pid, wt in rows if wt and os.path.realpath(wt) == ws_dir]
                  if not canonical_id and ws_ids:
                      canonical_id = ws_ids[0]
                  if canonical_id and ws_ids:
                      other_ids = [pid for pid in ws_ids if pid != canonical_id]
                      for old_id in other_ids:
                          conn.execute("UPDATE session_v2 SET project_id = ? WHERE project_id = ?", (canonical_id, old_id))
                          conn.execute("DELETE FROM worktree WHERE project_id = ?", (old_id,))
                          conn.execute("DELETE FROM project WHERE id = ?", (old_id,))
                      conn.commit()
                  conn.close()
              except Exception:
                  pass

          if canonical_id and os.path.isdir(os.path.join(ws_dir, ".git")):
              try:
                  with open(os.path.join(ws_dir, ".git", "opencode"), "w", encoding="utf-8") as gf:
                      gf.write(canonical_id)
              except Exception:
                  pass
          PYRESEOF
          RESTOREEOF
          chmod +x "$HOME/.local/bin/oc-restore"

          # ------------------------------------------------------------------
          # Helper 2: Update Link Permanen GitHub Pages + Kirim Notif Telegram/Discord
          # ------------------------------------------------------------------
          cat << 'PUBEOF' > "$HOME/.local/bin/oc-publish-url"
          #!/usr/bin/env bash
          NEW_URL="$1"
          [ -z "$NEW_URL" ] && exit 0
          echo "$NEW_URL" > /tmp/current_url.txt

          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          PAGES_URL="https://${OWNER_LOWER}.github.io/${REPO}/"
          echo "$PAGES_URL" > /tmp/pages_url.txt

          if [ -n "$GITHUB_REPOSITORY" ] && [ -n "$GH_TOKEN" ]; then
            TMP_PAGES=$(mktemp -d)
            (
              cd "$TMP_PAGES"
              git init -q -b gh-pages
              git config user.name "OpenCode Cloud"
              git config user.email "bot@opencode.local"
              NOW_WIB=$(TZ=Asia/Jakarta date '+%d %b %Y %H:%M WIB')
              cat << HTMLEOF > index.html
          <!doctype html>
          <html lang="id">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>OpenCode Cloud Redirect</title>
            <meta http-equiv="refresh" content="2;url=${NEW_URL}" />
            <style>
              * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #f3f4f6; padding: 18px; text-align: center; }
              .box { width: 100%; max-width: 430px; background: #161922; border: 1px solid #2a2f3d; border-radius: 18px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
              .badge { display: inline-block; background: #064e3b; color: #6ee7b7; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
              h1 { margin: 0 0 8px; font-size: 21px; }
