    <script>
        document.addEventListener('alpine:init', () => {
            if (!Alpine.data('appState')) {
                Alpine.data('appState', () => ({
                    darkMode: document.documentElement.classList.contains('dark'),
                    globalLoading: false,
                    toasts: window.serverToasts || [],
                    init() {
                        window.addEventListener('theme-changed', (e) => {
                            this.darkMode = e.detail.dark;
                        });
                        if (this.toasts && this.toasts.length > 0) {
                            this.toasts.forEach(toast => {
                                setTimeout(() => {
                                    this.toasts = this.toasts.filter(t => t.id !== toast.id);
                                }, 5000);
                            });
                        }
                    },
                    toggleTheme() {
                        this.darkMode = window.toggleTheme();
                    },
                    showToast(message, type = 'success', duration = 5000) {
                        const id = Date.now() + Math.random();
                        this.toasts.push({ id, message, type });
                        setTimeout(() => { this.toasts = this.toasts.filter((t) => t.id !== id); }, duration);
                    },
                }));
            }
        });
    </script>

    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

        window.toggleTheme = function() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            window.dispatchEvent(new CustomEvent('theme-changed', { detail: { dark: isDark } }));
            return isDark;
        };
    </script>
